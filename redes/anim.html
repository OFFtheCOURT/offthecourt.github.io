<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:BigS;src:url(fuentes/bigs900.ttf);font-weight:900}
@font-face{font-family:BigS;src:url(fuentes/bigs800.ttf);font-weight:800}
@font-face{font-family:BigS;src:url(fuentes/bigs700.ttf);font-weight:700}
@font-face{font-family:BarlowC;src:url(fuentes/barlowc700.ttf);font-weight:700}
@font-face{font-family:BarlowC;src:url(fuentes/barlowc600.ttf);font-weight:600}
@font-face{font-family:Barlow;src:url(fuentes/barlow700.ttf);font-weight:700}
@font-face{font-family:Barlow;src:url(fuentes/barlow600.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="salida/data.js"></script>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),X=cv.getContext('2d');
const D=window.DATA;
const ACC='#ff7a1a',ACC2='#ffb15c',FG='#f4f7fc',MUT='#a3afc4',DIM='#6b7893',CARD='#121a2a',CARD2='#19233a',LINE='#26324d';
const FD='BigS, "Inter Display", Inter, sans-serif', FL='BarlowC, "Inter Display", Inter, sans-serif', FB='Barlow, Inter, sans-serif';
const IM={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IM[k]=i;r()};i.onerror=()=>r();i.src=src})}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3), eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function hex(c,a=1){c=c.replace('#','');const n=parseInt(c,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function mix(c1,c2,t){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);const r=Math.round(lerp(a>>16&255,b>>16&255,t)),g=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1)}
function lum(c){const n=parseInt(c.slice(1),16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function fitText(txt,font,size,maxW,weight){let s=size;do{X.font=`${weight} ${s}px ${font}`;if(X.measureText(txt).width<=maxW)break;s-=2}while(s>10);return s}
// a readable team colour on the dark background
function vis(t){return lum(t.c)<0.16?(lum(t.a)>0.16?t.a:mix(t.c,'#ffffff',.45)):t.c}

/* ---------------- background & chrome ---------------- */
function bg(cA,cB,t){
  X.fillStyle='#070b13';X.fillRect(0,0,W,H);
  let g=X.createRadialGradient(80,260,0,80,260,900);g.addColorStop(0,hex(cA,.34));g.addColorStop(1,hex(cA,0));X.fillStyle=g;X.fillRect(0,0,W,H);
  g=X.createRadialGradient(1000,1500,0,1000,1500,1000);g.addColorStop(0,hex(cB,.30));g.addColorStop(1,hex(cB,0));X.fillStyle=g;X.fillRect(0,0,W,H);
  // drifting light streaks
  X.save();X.globalAlpha=.05;X.strokeStyle='#fff';X.lineWidth=3;
  for(let i=0;i<6;i++){const y=((i*360+t*40)%2200)-140;X.beginPath();X.moveTo(-50,y);X.lineTo(W+50,y-260);X.stroke()}
  X.restore();
}
function header(eyebrow,sub,idx,n){
  if(IM.logo)X.drawImage(IM.logo,56,96,92,92);
  X.textBaseline='alphabetic';X.font=`900 62px ${FD}`;X.fillStyle=FG;X.fillText('OFF',166,152);
  const w=X.measureText('OFF').width;X.fillStyle=ACC;X.fillText('COURT',166+w,152);
  X.font=`600 22px ${FL}`;X.fillStyle=MUT;X.letterSpacing='5px';X.fillText('BALONCESTO CADA MAÑANA',168,184);X.letterSpacing='0px';
  // eyebrow chip (right)
  X.font=`800 28px ${FL}`;X.letterSpacing='4px';const ew=X.measureText(eyebrow).width+40;
  X.save();X.translate(W-56-ew,104);X.transform(1,0,-.2,1,0,0);const g=X.createLinearGradient(0,0,ew,0);g.addColorStop(0,'#ff5a1f');g.addColorStop(.5,'#ff8a1a');g.addColorStop(1,'#ffc04d');X.fillStyle=g;rr(0,0,ew,46,5);X.fill();X.restore();
  X.fillStyle='#1a0b02';X.fillText(eyebrow,W-56-ew+16,137);
  X.font=`700 26px ${FL}`;X.fillStyle=MUT;X.textAlign='right';X.fillText(sub,W-56,186);X.textAlign='left';X.letterSpacing='0px';
  if(n){for(let i=0;i<n;i++){X.fillStyle=i<idx?hex(FG,.55):i==idx?ACC:hex(FG,.16);rr(56+i*((W-112+12)/n),214,(W-112+12)/n-12,7,4);X.fill()}}
}

/* ---------------- court in perspective ---------------- */
const CT={yF:560,yN:1040,wF:840,wN:1010};
function P(u,v){const s=lerp(CT.wF,CT.wN,v)/CT.wN;return {x:540+(u-.5)*CT.wN*s,y:lerp(CT.yF,CT.yN,v),s:s}}
function poly(pts){X.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1]);i?X.lineTo(q.x,q.y):X.moveTo(q.x,q.y)});}
function curve(f,a,b,n=40){X.beginPath();for(let i=0;i<=n;i++){const q=f(lerp(a,b,i/n));const p=P(q[0],q[1]);i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y)}}
function drawCourt(home,away){
  // apron + floor
  X.save();
  poly([[-.04,-.07],[1.04,-.07],[1.04,1.07],[-.04,1.07]]);X.fillStyle=mix(home.c,'#0a0e16',.55);X.fill();
  poly([[0,0],[1,0],[1,1],[0,1]]);const g=X.createLinearGradient(0,CT.yF,0,CT.yN);g.addColorStop(0,'#7a5434');g.addColorStop(1,'#a8764a');X.fillStyle=g;X.fill();
  X.save();poly([[0,0],[1,0],[1,1],[0,1]]);X.clip();X.strokeStyle='rgba(60,30,10,.18)';X.lineWidth=2;
  for(let i=1;i<30;i++){poly([[0,i/30],[1,i/30]]);X.stroke()}
  X.restore();
  // painted keys + centre
  const hc=home.c;
  for(const side of [0,1]){const u0=side?1:0,u1=side?1-.202:.202;poly([[u0,.34],[u1,.34],[u1,.66],[u0,.66]]);X.fillStyle=hex(hc,.88);X.fill()}
  curve(a=>[.5+.0638*Math.cos(a),.5+.12*Math.sin(a)],0,Math.PI*2);X.fillStyle=hex(hc,.88);X.fill();
  // lines
  X.strokeStyle='rgba(255,255,255,.85)';X.lineWidth=4;X.lineJoin='round';
  poly([[0,0],[1,0],[1,1],[0,1],[0,0]]);X.stroke();
  poly([[.5,0],[.5,1]]);X.stroke();
  curve(a=>[.5+.0638*Math.cos(a),.5+.12*Math.sin(a)],0,Math.PI*2);X.stroke();
  for(const side of [0,1]){
    const sg=side?-1:1,u0=side?1:0,hu=side?.944:.056,ku=side?1-.202:.202;
    poly([[u0,.34],[ku,.34],[ku,.66],[u0,.66]]);X.stroke();
    curve(a=>[ku+sg*.0638*Math.cos(a)*0,.5],0,1);
    curve(a=>[ku+sg*.0638*Math.cos(a),.5+.12*Math.sin(a)],-Math.PI/2,Math.PI/2);X.stroke();
    const A=Math.asin(.44/.475);
    curve(a=>[hu+sg*.2527*Math.cos(a),.5+.475*Math.sin(a)],-A,A,50);X.stroke();
    poly([[u0,.06],[hu+sg*.2527*Math.cos(A),.06]]);X.stroke();poly([[u0,.94],[hu+sg*.2527*Math.cos(A),.94]]);X.stroke();
  }
  // logo at centre
  X.restore();
}
function hoopPos(side){const p=P(side?.944:.056,.5);return {x:p.x,y:p.y-178*p.s,s:p.s}}
function drawHoop(side,flash){
  const sg=side?1:-1,ub=side?.985:.015;
  const a=P(ub,.42),b=P(ub,.58),base=P(side?1.025:-.025,.5);
  // stanchion
  X.strokeStyle='#2a3348';X.lineWidth=10;X.beginPath();X.moveTo(base.x,base.y);X.lineTo(base.x,base.y-200*base.s);X.lineTo(P(ub,.5).x,P(ub,.5).y-205*base.s);X.stroke();
  X.fillStyle='rgba(30,40,60,.6)';X.beginPath();X.ellipse(base.x,base.y,30,10,0,0,7);X.fill();
  // board
  const hb=110,lb=150;X.beginPath();X.moveTo(a.x,a.y-(lb+hb)*a.s);X.lineTo(b.x,b.y-(lb+hb)*b.s);X.lineTo(b.x,b.y-lb*b.s);X.lineTo(a.x,a.y-lb*a.s);X.closePath();
  X.fillStyle='rgba(235,242,255,.55)';X.fill();X.strokeStyle='#fff';X.lineWidth=4;X.stroke();
  // rim + net
  const h=hoopPos(side);
  X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=2.4;
  for(let i=0;i<7;i++){const ang=Math.PI*i/6;const x0=h.x+Math.cos(ang)*22*h.s,x1=h.x+Math.cos(ang)*12*h.s;X.beginPath();X.moveTo(x0,h.y);X.lineTo(x1,h.y+34*h.s);X.stroke()}
  X.strokeStyle=flash>0?mix('#ff5a1f','#ffe08a',flash):'#ff5a1f';X.lineWidth=6;X.beginPath();X.ellipse(h.x,h.y,23*h.s,7*h.s,0,0,7);X.stroke();
  if(flash>0){X.save();X.globalAlpha=flash*.8;const g=X.createRadialGradient(h.x,h.y,0,h.x,h.y,90);g.addColorStop(0,'rgba(255,200,90,.9)');g.addColorStop(1,'rgba(255,200,90,0)');X.fillStyle=g;X.fillRect(h.x-90,h.y-90,180,180);X.restore()}
}
const SKIN=['#f1cfae','#d9a77f','#b07a52','#8a5a3a','#e8bf98'];
function figure(f){
  const p=P(f.u,f.v),s=p.s*1.18,Hh=118*s,x=p.x,y=p.y-f.jump*s;
  const sp=clamp(f.speed*14,0,1),ph=f.phase;
  // shadow
  X.fillStyle='rgba(0,0,0,.32)';X.beginPath();X.ellipse(x,p.y+2,26*s*(1-f.jump/120),8*s,0,0,7);X.fill();
  if(f.hl){X.save();X.strokeStyle=ACC;X.lineWidth=5;X.globalAlpha=.6+.4*Math.sin(f.t*9);X.beginPath();X.ellipse(x,p.y+2,40*s,13*s,0,0,7);X.stroke();X.restore()}
  const hipY=y-.46*Hh,shY=y-.80*Hh;
  const sw=Math.sin(ph)*16*s*sp,lift=Math.max(0,Math.cos(ph))*6*s*sp;
  // legs
  X.lineCap='round';X.strokeStyle=f.skin;X.lineWidth=10*s;
  X.beginPath();X.moveTo(x-7*s,hipY);X.lineTo(x-7*s+sw,y-lift);X.stroke();
  X.beginPath();X.moveTo(x+7*s,hipY);X.lineTo(x+7*s-sw,y-(Math.max(0,-Math.cos(ph))*6*s*sp));X.stroke();
  X.fillStyle='#f4f7fc';X.beginPath();X.ellipse(x-7*s+sw+3*s*f.dir,y-lift,8*s,4.5*s,0,0,7);X.fill();
  X.beginPath();X.ellipse(x+7*s-sw+3*s*f.dir,y,8*s,4.5*s,0,0,7);X.fill();
  // shorts
  X.fillStyle=f.c2;rr(x-19*s,hipY-6*s,38*s,.17*Hh,6*s);X.fill();
  // arms
  X.strokeStyle=f.skin;X.lineWidth=8*s;
  const armSw=-Math.sin(ph)*12*s*sp;
  if(f.shoot>0){const k=f.shoot;X.beginPath();X.moveTo(x-14*s,shY+6*s);X.lineTo(x-6*s+f.dir*6*s,shY-46*s*k);X.stroke();X.beginPath();X.moveTo(x+14*s,shY+6*s);X.lineTo(x+6*s+f.dir*6*s,shY-46*s*k);X.stroke()}
  else{X.beginPath();X.moveTo(x-16*s,shY+6*s);X.lineTo(x-20*s+armSw,shY+40*s);X.stroke();
    if(f.ball){X.beginPath();X.moveTo(x+16*s,shY+6*s);X.lineTo(x+18*s*f.dir+10*s,shY+42*s);X.stroke()}
    else{X.beginPath();X.moveTo(x+16*s,shY+6*s);X.lineTo(x+20*s-armSw,shY+40*s);X.stroke()}}
  // jersey
  X.fillStyle=f.c;rr(x-20*s,shY,40*s,hipY-shY+4*s,9*s);X.fill();
  X.strokeStyle=f.c3;X.lineWidth=3*s;rr(x-20*s,shY,40*s,hipY-shY+4*s,9*s);X.stroke();
  X.fillStyle=f.c3;X.font=`700 ${Math.round(21*s)}px ${FL}`;X.textAlign='center';X.fillText(f.num,x,shY+26*s);X.textAlign='left';
  // head
  X.fillStyle=f.skin;X.beginPath();X.arc(x,shY-15*s,13.5*s,0,7);X.fill();
  X.fillStyle='#1d1612';X.beginPath();X.arc(x,shY-18*s,13.5*s,Math.PI*1.02,Math.PI*1.98);X.fill();
}
function ball(x,y,s){X.fillStyle='#ff7a1a';X.beginPath();X.arc(x,y,11*s,0,7);X.fill();X.strokeStyle='#3a1a05';X.lineWidth=1.6*s;X.beginPath();X.arc(x,y,11*s,0,7);X.moveTo(x-11*s,y);X.lineTo(x+11*s,y);X.moveTo(x,y-11*s);X.lineTo(x,y+11*s);X.stroke()}
function nameTag(x,y,txt,col){
  X.font=`700 30px ${FL}`;X.letterSpacing='2px';const w=X.measureText(txt).width+34;X.letterSpacing='0px';
  let bx=clamp(x-w/2,30,W-30-w);
  X.fillStyle='rgba(0,0,0,.35)';rr(bx+4,y-54,w,46,23);X.fill();
  X.fillStyle=col;rr(bx,y-58,w,46,23);X.fill();X.strokeStyle='#fff';X.lineWidth=3;X.stroke();
  X.beginPath();X.moveTo(x-10,y-13);X.lineTo(x+10,y-13);X.lineTo(x,y);X.closePath();X.fillStyle=col;X.fill();
  X.fillStyle=lum(col)>.6?'#0b1020':'#fff';X.letterSpacing='2px';X.fillText(txt,bx+17,y-25);X.letterSpacing='0px';
}

/* ---------------- game simulation ----------------
   Cada posesión es una jugada con guion: posiciones clave de los 5 atacantes (en distancia a
   su canasta "du" y profundidad "v"), y la secuencia del balón (botar, pase, tiro).
   Los defensores siguen a su par. Roles: 0 base, 1 ala izq, 2 ala der, 3 esquina, 4 pívot. */
const BASE=[[.27,.5],[.19,.17],[.19,.83],[.045,.07],[.09,.64]];
const PLAYS={
  // pase y tiro de media o de tres
  jumper:(sr)=>({len:2.5,kf:[[[.9,...BASE[0]]],[[.9,...BASE[1]]],[[.9,...BASE[2]]],[[.9,...BASE[3]]],[[.9,...BASE[4]]]],
    ball:sr==0?[['hold',0,.35,1.75,1],['shot',0,1.75,2.3,'jumper']]:[['hold',0,.35,1.25,1],['pass',0,sr,1.25,1.5,30],['hold',sr,1.5,1.75,0],['shot',sr,1.75,2.3,'jumper']]}),
  // contraataque y mate
  fastbreak:(sr)=>({len:2.1,defArrive:1.9,kf:[[[1.25,.07,.46]],[[1.15,.16,.2]],[[1.2,.13,.8]],[[1.3,.28,.12]],[[1.4,.35,.6]]].map((k,i)=>i==sr&&sr!=0?[[1.25,.06,.55]]:(sr!=0&&i==0?[[1.15,.2,.45]]:k)),
    ball:sr==0?[['hold',0,.25,1.3,1],['shot',0,1.3,1.6,'dunk']]:[['hold',0,.25,1.0,1],['pass',0,sr,1.0,1.2,20],['hold',sr,1.2,1.3,0],['shot',sr,1.3,1.6,'dunk']]}),
  // bloqueo y continuación: el base penetra (bandeja) o la pasa a la esquina (triple)
  pnr:(sr)=>({len:sr==3?2.8:2.4,kf:[[[.9,...BASE[0]],[1.3,.26,.5],[1.9,.075,.44]],[[.9,...BASE[1]]],[[.9,...BASE[2]]],[[.9,...BASE[3]]],[[.9,.15,.58],[1.25,.25,.42],[1.8,.1,.5]]],
    ball:sr==3?[['hold',0,.35,1.85,1],['pass',0,3,1.85,2.05,25],['hold',3,2.05,2.2,0],['shot',3,2.2,2.75,'jumper']]:
       sr==4?[['hold',0,.35,1.7,1],['pass',0,4,1.7,1.85,15],['hold',4,1.85,1.95,0],['shot',4,1.95,2.25,'dunk']]:
       [['hold',0,.35,1.9,1],['shot',0,1.9,2.25,'layup']]}),
  // juego al poste: entrada al pívot, se mete hacia dentro y gancho
  post:(sr)=>({len:2.7,kf:[[[.9,...BASE[0]]],[[.9,...BASE[1]]],[[.9,...BASE[2]]],[[.9,...BASE[3]]],[[.9,.11,.66],[2.0,.055,.58]]],
    ball:[['hold',0,.35,1.1,1],['pass',0,4,1.1,1.35,20],['hold',4,1.35,2.0,1],['shot',4,2.0,2.45,'hook']]}),
  // circulación de balón y triple
  swing:(sr)=>{const mid=sr==2?1:2;return {len:3.0,kf:[[[.9,...BASE[0]]],[[.9,...BASE[1]]],[[.9,...BASE[2]]],[[.9,...BASE[3]]],[[.9,...BASE[4]]]],
    ball:[['hold',0,.35,1.1,1],['pass',0,mid,1.1,1.32,30],['hold',mid,1.32,1.55,0],['pass',mid,sr,1.55,1.8,30],['hold',sr,1.8,2.0,0],['shot',sr,2.0,2.55,'jumper']]}},
  // corte por la espalda y alley-oop
  oop:(sr)=>({len:2.4,kf:[[[.9,...BASE[0]]],[[.9,...BASE[1]]],[[.9,...BASE[2]],[1.2,.2,.8],[1.75,.035,.55]],[[.9,...BASE[3]]],[[.9,...BASE[4]]]].map((k,i)=>i==sr&&sr!=2?[[.9,...BASE[i]],[1.2,...BASE[i]],[1.75,.035,.55]]:k),
    ball:[['hold',0,.35,1.35,1],['pass',0,sr,1.35,1.75,170],['shot',sr,1.75,1.95,'dunk']]}),
  // penetración por línea de fondo y bandeja
  drive:(sr)=>({len:2.4,kf:[[[.9,...BASE[0]]],[[.9,...BASE[1]]],[[.9,...BASE[2]]],[[.9,...BASE[3]]],[[.9,...BASE[4]]]].map((k,i)=>i==sr?[[.9,...BASE[i]],[1.3,...BASE[i]],[1.85,.04,BASE[i][1]<.5?.38:.62]]:k),
    ball:[['hold',0,.35,1.1,1],['pass',0,sr,1.1,1.3,25],['hold',sr,1.3,1.85,1],['shot',sr,1.85,2.15,'layup']]}),
};
// rol del tirador según la jugada
const SHOOT_ROLES={jumper:[1,2,3,0],fastbreak:[0,1,2],pnr:[0,3,4],post:[4],swing:[3,2,1],oop:[2,1,4],drive:[1,2]};
const SHOT_PTS=(play,sr)=>(play=='swing'||(play=='pnr'&&sr==3)||(play=='jumper'&&sr!=4))?3:2;
function stylePick(R,st,prev,prof){
  // pesos según el estilo del equipo (o del jugador nombrado)
  const w={jumper:1,fastbreak:.6,pnr:1,post:.6,swing:.8,oop:.4,drive:.8};
  if(st){w.swing+=st.three*2.5;w.jumper+=st.three*1.5;w.fastbreak+=st.fast*1.2;w.post+=st.paint*.8;w.drive+=st.paint*.8;w.oop+=st.paint*.4}
  if(prof){if(prof.three){w.swing+=3;w.jumper+=3;w.post=0;w.oop=0}else if(prof.big){w.post+=3;w.oop+=2;w.pnr+=1;w.swing=0;w.jumper=0}else{w.drive+=2;w.pnr+=2;w.fastbreak+=1.5}}
  if(prev)w[prev]*=.15;
  const ks=Object.keys(w),tot=ks.reduce((a,k)=>a+w[k],0);let r=R()*tot;for(const k of ks){r-=w[k];if(r<=0)return k}return ks[0];
}
const SP=1.3;
function buildSim(sc){
  const R=rng(sc.seed),t0=.4,side0=R()<.5?0:1; // side0: equipo que ataca a la derecha
  const marks=sc.marks.filter(m=>m.team!=null).map(m=>({...m,t:m.t*SP})).sort((a,b)=>a.t-b.t);
  const pos=[];let t=t0,last=R()<.5?0:1,prevPlay=null,mi=0;
  while(t<sc.dur*SP+.5){
    let off=1-last,play,sr,shooterFig,tag=null;
    const m=marks[mi];
    if(m){ // ¿esta posesión puede ser la del jugador nombrado?
      const pl=stylePick(R,null,prevPlay,m.prof),L=PLAYS[pl](SHOOT_ROLES[pl][0]),shotT=L.ball[L.ball.length-1][2];
      if(m.t<=t+shotT-.3){tag=m;off=m.team;play=pl;mi++}
    }
    if(!play)play=stylePick(R,sc.teams[off].style,prevPlay,null);
    const roles=SHOOT_ROLES[play];sr=roles[Math.floor(R()*roles.length)];
    if(tag&&tag.prof){if(tag.prof.three&&play=='pnr')sr=3;if(tag.prof.big&&(play=='pnr'||play=='oop'))sr=4}
    // reparto de roles: permutación aleatoria con el tirador en su rol
