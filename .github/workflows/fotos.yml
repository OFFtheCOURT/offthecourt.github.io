name: Fotos de jugadores

on:
  schedule:
    - cron: '23 4 * * 1'           # cada lunes de madrugada: busca fotos de jugadores nuevos
  workflow_dispatch:               # botón "Run workflow" para lanzarlo a mano
    inputs:
      recrop:
        description: 'Volver a descargar y recortar todas las fotos (1 = sí)'
        required: false
        default: '0'
      style:
        description: 'Aplicar el patrón Offcourt (1 = sí)'
        required: false
        default: '0'
      only:
        description: 'Solo estos jugadores (ids separados por comas; vacío = todos)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: offcourt
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow "opencv-python-headless<5" onnxruntime numpy
      - name: Modelos (detector de caras YuNet y recorte de fondo BiRefNet)
        run: |
          mkdir -p voz
          curl -sL -o voz/yunet.onnx https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx
          if [ "${{ github.event.inputs.style }}" = "1" ]; then curl -sL -o voz/birefnet.onnx https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx; fi
      - run: python3 photos.py
        env:
          RECROP: ${{ github.event.inputs.recrop || '0' }}
          STYLE: ${{ github.event.inputs.style || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
      - name: Volver a generar la web con las fotos
        run: bash run.sh
      - name: Guardar fotos y web
        run: |
          git config user.name "offcourt-bot"
          git config user.email "offcourt-bot@users.noreply.github.com"
          git add photos index.html box
          git diff --cached --quiet || git commit -m "Fotos de jugadores"
          git pull --rebase -X theirs origin main || true
          git push
